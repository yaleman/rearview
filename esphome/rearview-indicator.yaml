esphome:
  name: rearview-indicator
  friendly_name: Rearview Indicator
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(oled).turn_off();
  on_loop:
    then:
      - lambda: |-
          static bool passkey_configured = false;
          static esp_err_t last_error = ESP_OK;
          if (passkey_configured) {
            return;
          }

          uint32_t passkey = 123456;
          const auto result = esp_ble_gap_set_security_param(
              ESP_BLE_SM_SET_STATIC_PASSKEY,
              &passkey,
              sizeof(passkey));
          switch (result) {
            case ESP_OK:
              passkey_configured = true;
              ESP_LOGI("rearview_ble", "BLE passkey configured");
              break;
            case ESP_ERR_INVALID_STATE:
              break;
            default:
              if (result != last_error) {
                ESP_LOGE("rearview_ble", "Failed to configure BLE passkey: %s", esp_err_to_name(result));
              }
              break;
          }
          last_error = result;

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components:
      - esp32_ble_server

logger:

esp32_ble:
  name: Rearview Light
  io_capability: display_only
  auth_req_mode: sc_mitm_bond
  min_key_size: 16
  max_key_size: 16
  max_connections: 1

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  id: oled_bus

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: oled_bus
    model: "SSD1306 72x40"
    address: 0x3C
    update_interval: never

esp32_ble_server:
  manufacturer: Rearview
  model: RGB Indicator
  max_clients: 1
  services:
    - uuid: 898a0c20-6d38-4a49-9f84-f942b4cd9380
      advertise: true
      characteristics:
        - id: colour_characteristic
          uuid: 898a0c21-6d38-4a49-9f84-f942b4cd9380
          description: RGB colour and brightness
          write: true
          on_write:
            then:
              - lambda: |-
                  if (x.size() != 4) {
                    ESP_LOGW("rearview_ble", "Expected 4 colour bytes, received %u", x.size());
                    return;
                  }

                  auto colour = Color(x[0], x[1], x[2]) * x[3];
                  if (!colour.is_on()) {
                    id(oled).fill(colour);
                    id(oled).update();
                    id(oled).turn_off();
                    return;
                  }

                  id(oled).turn_on();
                  id(oled).fill(colour);
                  id(oled).update();
